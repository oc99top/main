<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC99.TOP · 配置编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            padding: 2rem 1.5rem;
            color: #0b2b44;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid #e6edf4;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-weight: 400;
            font-size: 1rem;
            color: #4c6f8a;
            margin-left: 0.4rem;
        }

        /* 选项卡 */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
            border-bottom: 2px solid #e6edf4;
            padding-bottom: 0;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 0.6rem 1.6rem;
            border-radius: 12px 12px 0 0;
            font-weight: 600;
            font-size: 0.95rem;
            color: #4f718b;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            position: relative;
            bottom: -2px;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover {
            background: #f1f7fc;
            color: #1b4b6b;
        }
        .tab-btn.active {
            color: #1b5e85;
            border-bottom-color: #1b5e85;
            background: #f9fcff;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .form-section {
            background: #f9fcff;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            border: 1px solid #e2eaf0;
        }

        .form-section h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1b4b6b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .field-group {
            margin-bottom: 1.4rem;
        }

        .field-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f4a66;
            margin-bottom: 0.25rem;
        }
        .field-group .hint {
            font-size: 0.75rem;
            color: #6d8aa3;
            margin-top: 0.1rem;
        }

        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #d0dde9;
            border-radius: 12px;
            font-size: 0.95rem;
            background: white;
            transition: 0.15s;
            font-family: inherit;
        }

        .field-group input:focus,
        .field-group textarea:focus,
        .field-group select:focus {
            outline: none;
            border-color: #2b7aa2;
            box-shadow: 0 0 0 3px rgba(43, 122, 162, 0.15);
        }

        .field-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .inline-flex {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .inline-flex .field-group {
            flex: 1;
            min-width: 120px;
        }

        .circle-list {
            margin: 1.2rem 0;
            background: #f2f6fb;
            border-radius: 16px;
            padding: 0.8rem 1rem;
            max-height: 260px;
            overflow-y: auto;
        }

        .circle-item {
            background: white;
            border-radius: 12px;
            padding: 0.6rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #dae3ec;
        }

        .circle-item .info {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .circle-item .info small {
            font-weight: 400;
            color: #4f718b;
            margin-left: 0.5rem;
        }

        .circle-item .actions button {
            background: none;
            border: none;
            color: #b91c1c;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            transition: 0.1s;
        }
        .circle-item .actions button:hover {
            background: #fee2e2;
        }

        .btn {
            background: #e6eef8;
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a4d6e;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-family: inherit;
        }

        .btn-primary { background: #1b5e85; color: white; }
        .btn-primary:hover { background: #124a6b; }
        .btn-outline { background: transparent; border: 1px solid #b7cedf; }
        .btn-outline:hover { background: #eaf1f9; }
        .btn-success { background: #1f7b5a; color: white; }
        .btn-success:hover { background: #146347; }
        .btn-download { background: #5a4f8a; color: white; }
        .btn-download:hover { background: #473d71; }

        .action-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .json-preview {
            background: #0d1f2e;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            color: #e3edf5;
            display: flex;
            flex-direction: column;
            height: fit-content;
            min-height: 400px;
        }

        .json-preview h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #b6d4e8;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .json-preview h2 .json-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        .json-preview h2 button {
            background: #2a4b64;
            border: none;
            color: white;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
        }
        .json-preview h2 button:hover {
            background: #3c6380;
        }

        .json-code {
            background: #0a1924;
            padding: 1.2rem 1.4rem;
            border-radius: 16px;
            overflow: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: #d4e2ed;
            flex: 1;
            min-height: 300px;
            border: 1px solid #27445c;
        }

        .copy-toast {
            background: #1e3b4f;
            color: #b6e0ff;
            padding: 0.25rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
        }
        .copy-toast.show { opacity: 1; }

        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #dce7f0;
            padding-top: 1rem;
            font-size: 0.85rem;
            color: #4d6f89;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .status-badge {
            background: #d4edda;
            color: #0c5e3a;
            padding: 0.1rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .tag-badge {
            display: inline-block;
            background: #dae6f0;
            border-radius: 20px;
            padding: 0.1rem 0.7rem;
            font-size: 0.75rem;
            margin-right: 0.3rem;
        }

        .empty-hint {
            color: #6d8aa3;
            font-style: italic;
            padding: 0.2rem 0;
        }

        .load-status {
            font-size: 0.8rem;
            font-weight: 400;
            color: #4f718b;
        }

        @media (max-width: 800px) {
            .editor-grid { grid-template-columns: 1fr; }
            .app { padding: 1.2rem; }
            .tabs { gap: 0; }
            .tab-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <h1>
        ⚙️ 配置编辑器
        <small>OC99.TOP · 双文件管理</small>
        <span class="load-status" id="loadStatus" style="margin-left:auto;"></span>
    </h1>

    <!-- 选项卡 -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="notice">📋 公告配置 (config.json)</button>
        <button class="tab-btn" data-tab="circles">🧩 圈子配置 (circles.json)</button>
    </div>

    <!-- Tab 1: 公告配置 -->
    <div class="tab-content active" id="tabNotice">
        <div class="editor-grid">
            <!-- 左：公告表单 -->
            <div class="form-section">
                <h2>📋 编辑公告</h2>
                <div class="field-group">
                    <label>标题</label>
                    <input type="text" id="noticeTitle" placeholder="公告标题">
                </div>
                <div class="field-group">
                    <label>内容 <span style="font-weight:400; color:#4f718b;">(支持换行)</span></label>
                    <textarea id="noticeContent" rows="3" placeholder="公告内容，多行直接换行"></textarea>
                </div>
                <div class="inline-flex">
                    <div class="field-group">
                        <label>日期</label>
                        <input type="text" id="noticeDate" placeholder="2026-07-24">
                    </div>
                    <div class="field-group">
                        <label>作者</label>
                        <input type="text" id="noticeAuthor" placeholder="作者">
                    </div>
                    <div class="field-group">
                        <label>类型</label>
                        <select id="noticeType">
                            <option value="重要">重要</option>
                            <option value="更新">更新</option>
                            <option value="维护">维护</option>
                            <option value="普通" selected>普通</option>
                        </select>
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn btn-success" id="noticeGenerateBtn">✅ 生成 config.json</button>
                    <button class="btn btn-outline" id="noticePullBtn">🔄 重新拉取</button>
                    <button class="btn btn-outline" id="noticeResetBtn">↩️ 恢复默认</button>
                </div>
                <div style="margin-top:0.6rem; font-size:0.8rem; color:#4f718b;">
                    ⚡ 编辑后生成 JSON，复制或下载后保存为 <code>config.json</code>。
                </div>
            </div>

            <!-- 右：config.json 预览 -->
            <div class="json-preview">
                <h2>
                    📄 config.json
                    <span class="json-actions">
                        <span class="copy-toast" id="noticeCopyToast">已复制</span>
                        <button id="noticeCopyBtn">📋 复制</button>
                        <button id="noticeDownloadBtn">⬇️ 下载</button>
                    </span>
                </h2>
                <div class="json-code" id="noticeJsonOutput">
                    // 正在加载配置...
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 2: 圈子配置 -->
    <div class="tab-content" id="tabCircles">
        <div class="editor-grid">
            <!-- 左：圈子表单 -->
            <div class="form-section">
                <h2 style="margin-bottom:0.5rem;">🧩 编辑小圈</h2>
                <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.8rem;">
                    <input type="text" id="circleName" placeholder="圈名" style="flex:1; min-width:100px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                    <input type="text" id="circleStatus" placeholder="状态 (active/maintenance/offline)" style="flex:1; min-width:120px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                    <input type="text" id="circleUrl" placeholder="链接 (可选)" style="flex:1; min-width:100px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                    <button class="btn btn-primary" id="addCircleBtn" style="padding:0.3rem 1.2rem;">➕ 添加</button>
                </div>
                <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
                    <input type="text" id="circleDesc" placeholder="描述" style="flex:2; min-width:150px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                    <input type="text" id="circleTags" placeholder="标签 逗号分隔 (如: 技术,开源)" style="flex:1; min-width:120px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                </div>

                <div class="circle-list" id="circleListContainer">
                    <div class="empty-hint">加载中...</div>
                </div>

                <div class="action-row">
                    <button class="btn btn-success" id="circlesGenerateBtn">✅ 生成 circles.json</button>
                    <button class="btn btn-outline" id="circlesPullBtn">🔄 重新拉取</button>
                    <button class="btn btn-outline" id="circlesResetBtn">↩️ 恢复默认</button>
                </div>
                <div style="margin-top:0.6rem; font-size:0.8rem; color:#4f718b;">
                    ⚡ 编辑后生成 JSON，复制或下载后保存为 <code>circles.json</code>。
                </div>
            </div>

            <!-- 右：circles.json 预览 -->
            <div class="json-preview">
                <h2>
                    📄 circles.json
                    <span class="json-actions">
                        <span class="copy-toast" id="circlesCopyToast">已复制</span>
                        <button id="circlesCopyBtn">📋 复制</button>
                        <button id="circlesDownloadBtn">⬇️ 下载</button>
                    </span>
                </h2>
                <div class="json-code" id="circlesJsonOutput">
                    // 正在加载配置...
                </div>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <span>编辑后分别生成 JSON，手动保存到对应的文件 (config.json / circles.json)。也可点击「下载」直接保存文件。</span>
        <span>OC99.TOP · 配置驱动 · 双文件管理</span>
    </div>
</div>

<script>
    (function() {
        // ========== 默认数据 ==========
        const DEFAULT_NOTICE = {
            title: "欢迎来到 OC99.TOP",
            content: "我们致力于维护各个圈子的发展、安全与和谐。\n如果您需要技术支持或希望注册新圈子，请通过下方链接联系我们。",
            date: "2026-07-24",
            author: "OC99 管理组",
            type: "重要"
        };

        const DEFAULT_CIRCLES = [
            { name: "示例圈 A", description: "这是一个活跃的示例圈子，专注于技术交流与资源共享。", status: "active", url: "https://example-a.oc99.top", tags: ["技术", "开源"] },
            { name: "示例圈 B", description: "该圈子目前正在进行服务器维护，预计明日恢复。", status: "maintenance", url: "https://example-b.oc99.top", tags: ["社区", "维护中"] },
            { name: "示例圈 C", description: "由于业务调整，该圈子暂时离线，重启时间待定。", status: "offline", url: "", tags: ["暂停"] }
        ];

        // ========== 状态 ==========
        let circles = [];

        // ========== DOM: 公告相关 ==========
        const noticeTitle = document.getElementById('noticeTitle');
        const noticeContent = document.getElementById('noticeContent');
        const noticeDate = document.getElementById('noticeDate');
        const noticeAuthor = document.getElementById('noticeAuthor');
        const noticeType = document.getElementById('noticeType');
        const noticeJsonOutput = document.getElementById('noticeJsonOutput');
        const noticeGenerateBtn = document.getElementById('noticeGenerateBtn');
        const noticePullBtn = document.getElementById('noticePullBtn');
        const noticeResetBtn = document.getElementById('noticeResetBtn');
        const noticeCopyBtn = document.getElementById('noticeCopyBtn');
        const noticeDownloadBtn = document.getElementById('noticeDownloadBtn');
        const noticeCopyToast = document.getElementById('noticeCopyToast');

        // ========== DOM: 圈子相关 ==========
        const circleName = document.getElementById('circleName');
        const circleStatus = document.getElementById('circleStatus');
        const circleUrl = document.getElementById('circleUrl');
        const circleDesc = document.getElementById('circleDesc');
        const circleTags = document.getElementById('circleTags');
        const circleListContainer = document.getElementById('circleListContainer');
        const circlesJsonOutput = document.getElementById('circlesJsonOutput');
        const addCircleBtn = document.getElementById('addCircleBtn');
        const circlesGenerateBtn = document.getElementById('circlesGenerateBtn');
        const circlesPullBtn = document.getElementById('circlesPullBtn');
        const circlesResetBtn = document.getElementById('circlesResetBtn');
        const circlesCopyBtn = document.getElementById('circlesCopyBtn');
        const circlesDownloadBtn = document.getElementById('circlesDownloadBtn');
        const circlesCopyToast = document.getElementById('circlesCopyToast');

        const loadStatus = document.getElementById('loadStatus');

        // ========== 选项卡切换 ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const tabId = 'tab' + this.dataset.tab.charAt(0).toUpperCase() + this.dataset.tab.slice(1);
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ========== 公告相关函数 ==========
        function getNoticeFromForm() {
            return {
                title: noticeTitle.value.trim() || '公告',
                content: noticeContent.value || '（空内容）',
                date: noticeDate.value.trim() || new Date().toISOString().slice(0,10),
                author: noticeAuthor.value.trim() || '管理员',
                type: noticeType.value || '普通'
            };
        }

        function setNoticeToForm(notice) {
            if (!notice) return;
            noticeTitle.value = notice.title || '';
            noticeContent.value = notice.content || '';
            noticeDate.value = notice.date || '';
            noticeAuthor.value = notice.author || '';
            noticeType.value = notice.type || '普通';
        }

        function generateNoticeConfig() {
            const notice = getNoticeFromForm();
            const config = { notice };
            const pretty = JSON.stringify(config, null, 2);
            noticeJsonOutput.textContent = pretty;
            return pretty;
        }

        // ========== 圈子相关函数 ==========
        function renderCircleList() {
            if (!circles || circles.length === 0) {
                circleListContainer.innerHTML = '<div class="empty-hint">暂无圈子，添加后显示在此</div>';
                return;
            }
            let html = '';
            circles.forEach((c, index) => {
                const tagsStr = (c.tags && c.tags.length) ? c.tags.map(t => '<span class="tag-badge">' + t + '</span>').join(' ') : '';
                const statusText = c.status || '未知';
                html += '<div class="circle-item"><div class="info">' + (c.name || '未命名') + ' <small>' + statusText + '</small>' + (c.url ? '<span style="color:#1f5e85;font-weight:400;">🔗</span>' : '') + '<span style="font-weight:400;color:#2d5a7a;">' + tagsStr + '</span></div><div class="actions"><button data-index="' + index + '" class="remove-circle-btn">✕</button></div></div>';
            });
            circleListContainer.innerHTML = html;
            document.querySelectorAll('.remove-circle-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    var idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < circles.length) {
                        circles.splice(idx, 1);
                        renderCircleList();
                        generateCirclesConfig();
                    }
                });
            });
        }

        function generateCirclesConfig() {
            var cleanCircles = (circles || []).map(function(c) {
                var tags = [];
                if (c.tags) {
                    if (Array.isArray(c.tags)) tags = c.tags;
                    else if (typeof c.tags === 'string') {
                        tags = c.tags.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
                    }
                }
                return {
                    name: c.name || '未命名',
                    description: c.description || '',
                    status: c.status || 'active',
                    url: c.url || '',
                    tags: tags
                };
            });

            var pretty = JSON.stringify(cleanCircles, null, 2);
            circlesJsonOutput.textContent = pretty;
            return pretty;
        }

        function loadCirclesToEditor(circlesData) {
            circles = JSON.parse(JSON.stringify(circlesData || []));
            renderCircleList();
            generateCirclesConfig();
        }

        // ========== 从远程拉取 ==========
        async function pullNotice() {
            loadStatus.textContent = '⏳ 加载 config.json...';
            noticeJsonOutput.textContent = '// 正在拉取 config.json ...';
            try {
                var resp = await fetch('config.json', { cache: 'no-cache', headers: { 'Accept': 'application/json' } });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var config = await resp.json();
                if (!config || typeof config !== 'object') throw new Error('格式无效');
                setNoticeToForm(config.notice || {});
                generateNoticeConfig();
                loadStatus.textContent = '✅ config.json 已加载';
            } catch (e) {
                console.warn('拉取 config.json 失败:', e);
                loadStatus.textContent = '⚠️ 拉取失败，使用默认';
                setNoticeToForm(DEFAULT_NOTICE);
                generateNoticeConfig();
            }
        }

        async function pullCircles() {
            loadStatus.textContent = '⏳ 加载 circles.json...';
            circlesJsonOutput.textContent = '// 正在拉取 circles.json ...';
            try {
                var resp = await fetch('circles.json', { cache: 'no-cache', headers: { 'Accept': 'application/json' } });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var data = await resp.json();
                if (!Array.isArray(data)) throw new Error('格式无效');
                loadCirclesToEditor(data);
                loadStatus.textContent = '✅ circles.json 已加载';
            } catch (e) {
                console.warn('拉取 circles.json 失败:', e);
                loadStatus.textContent = '⚠️ 拉取失败，使用默认';
                loadCirclesToEditor(DEFAULT_CIRCLES);
            }
        }

        // ========== 重置默认 ==========
        function resetNotice() {
            setNoticeToForm(DEFAULT_NOTICE);
            generateNoticeConfig();
            loadStatus.textContent = '↩️ 已恢复默认公告';
        }

        function resetCircles() {
            loadCirclesToEditor(DEFAULT_CIRCLES);
            loadStatus.textContent = '↩️ 已恢复默认圈子';
        }

        // ========== 添加圈子 ==========
        function addCircleFromForm() {
            var name = circleName.value.trim() || '未命名';
            var status = circleStatus.value.trim() || 'active';
            var url = circleUrl.value.trim() || '';
            var description = circleDesc.value.trim() || '';
            var tagsRaw = circleTags.value.trim();
            var tags = [];
            if (tagsRaw) {
                tags = tagsRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
            }
            var validStatus = ['active', 'maintenance', 'offline'];
            var finalStatus = validStatus.indexOf(status) !== -1 ? status : 'active';

            circles.push({
                name: name,
                description: description,
                status: finalStatus,
                url: url,
                tags: tags
            });

            circleName.value = '';
            circleStatus.value = '';
            circleUrl.value = '';
            circleDesc.value = '';
            circleTags.value = '';

            renderCircleList();
            generateCirclesConfig();
        }

        // ========== 复制 ==========
        function copyText(text, toastEl) {
            if (!text || text.indexOf('//') === 0) {
                alert('请先生成配置');
                return;
            }
            navigator.clipboard.writeText(text).then(function() {
                toastEl.classList.add('show');
                setTimeout(function() { toastEl.classList.remove('show'); }, 2000);
            }).catch(function() {
                var area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                toastEl.classList.add('show');
                setTimeout(function() { toastEl.classList.remove('show'); }, 2000);
            });
        }

        // ========== 下载 ==========
        function downloadJson(content, filename) {
            if (!content || content.indexOf('//') === 0) {
                alert('请先生成配置');
                return;
            }
            var blob = new Blob([content], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ========== 初始化 ==========
        async function init() {
            await Promise.all([pullNotice(), pullCircles()]);

            noticeGenerateBtn.addEventListener('click', generateNoticeConfig);
            noticePullBtn.addEventListener('click', pullNotice);
            noticeResetBtn.addEventListener('click', resetNotice);
            noticeCopyBtn.addEventListener('click', function() { copyText(noticeJsonOutput.textContent, noticeCopyToast); });
            noticeDownloadBtn.addEventListener('click', function() { downloadJson(noticeJsonOutput.textContent, 'config.json'); });

            circlesGenerateBtn.addEventListener('click', generateCirclesConfig);
            circlesPullBtn.addEventListener('click', pullCircles);
            circlesResetBtn.addEventListener('click', resetCircles);
            addCircleBtn.addEventListener('click', addCircleFromForm);
            circlesCopyBtn.addEventListener('click', function() { copyText(circlesJsonOutput.textContent, circlesCopyToast); });
            circlesDownloadBtn.addEventListener('click', function() { downloadJson(circlesJsonOutput.textContent, 'circles.json'); });

            var inputs = [circleName, circleStatus, circleUrl, circleDesc, circleTags];
            inputs.forEach(function(inp) {
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addCircleFromForm();
                    }
                });
            });
        }

        init();
    })();
</script>
</body>
</html>
