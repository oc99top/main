<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC99.TOP · 配置编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            padding: 2rem 1.5rem;
            color: #0b2b44;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid #e6edf4;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 small {
            font-weight: 400;
            font-size: 1rem;
            color: #4c6f8a;
            margin-left: 0.4rem;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* 左栏 表单 */
        .form-section {
            background: #f9fcff;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            border: 1px solid #e2eaf0;
        }

        .form-section h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1b4b6b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .field-group {
            margin-bottom: 1.4rem;
        }

        .field-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f4a66;
            margin-bottom: 0.25rem;
        }
        .field-group .hint {
            font-size: 0.75rem;
            color: #6d8aa3;
            margin-top: 0.1rem;
        }

        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #d0dde9;
            border-radius: 12px;
            font-size: 0.95rem;
            background: white;
            transition: 0.15s;
            font-family: inherit;
        }

        .field-group input:focus,
        .field-group textarea:focus,
        .field-group select:focus {
            outline: none;
            border-color: #2b7aa2;
            box-shadow: 0 0 0 3px rgba(43, 122, 162, 0.15);
        }

        .field-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .inline-flex {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .inline-flex .field-group {
            flex: 1;
            min-width: 120px;
        }

        /* 圈子卡片 (列表) */
        .circle-list {
            margin: 1.2rem 0;
            background: #f2f6fb;
            border-radius: 16px;
            padding: 0.8rem 1rem;
            max-height: 260px;
            overflow-y: auto;
        }

        .circle-item {
            background: white;
            border-radius: 12px;
            padding: 0.6rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #dae3ec;
        }

        .circle-item .info {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .circle-item .info small {
            font-weight: 400;
            color: #4f718b;
            margin-left: 0.5rem;
        }

        .circle-item .actions button {
            background: none;
            border: none;
            color: #b91c1c;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            transition: 0.1s;
        }
        .circle-item .actions button:hover {
            background: #fee2e2;
        }

        .btn {
            background: #e6eef8;
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a4d6e;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-primary {
            background: #1b5e85;
            color: white;
        }
        .btn-primary:hover {
            background: #124a6b;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b7cedf;
        }
        .btn-outline:hover {
            background: #eaf1f9;
        }

        .action-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        /* 右栏 json 展示 */
        .json-preview {
            background: #0d1f2e;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            color: #e3edf5;
            display: flex;
            flex-direction: column;
            height: fit-content;
            min-height: 400px;
        }

        .json-preview h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #b6d4e8;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .json-preview h2 button {
            background: #2a4b64;
            border: none;
            color: white;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .json-preview h2 button:hover {
            background: #3c6380;
        }

        .json-code {
            background: #0a1924;
            padding: 1.2rem 1.4rem;
            border-radius: 16px;
            overflow: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: #d4e2ed;
            flex: 1;
            min-height: 300px;
            border: 1px solid #27445c;
        }

        .copy-toast {
            background: #1e3b4f;
            color: #b6e0ff;
            padding: 0.25rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
        }

        .copy-toast.show {
            opacity: 1;
        }

        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #dce7f0;
            padding-top: 1rem;
            font-size: 0.85rem;
            color: #4d6f89;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        @media (max-width: 800px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
            .app {
                padding: 1.2rem;
            }
        }

        /* 模拟小标签 */
        .tag-badge {
            display: inline-block;
            background: #dae6f0;
            border-radius: 20px;
            padding: 0.1rem 0.7rem;
            font-size: 0.75rem;
            margin-right: 0.3rem;
        }

        .empty-hint {
            color: #6d8aa3;
            font-style: italic;
            padding: 0.2rem 0;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>
        ⚙️ config.json 可视化编辑器
        <small>OC99.TOP</small>
    </h1>

    <div class="editor-grid">
        <!-- 左：表单 -->
        <div class="form-section">
            <h2>📋 公告</h2>
            <div class="field-group">
                <label>标题</label>
                <input type="text" id="noticeTitle" value="欢迎来到 OC99.TOP" placeholder="公告标题">
            </div>
            <div class="field-group">
                <label>内容 <span style="font-weight:400; color:#4f718b;">(支持换行)</span></label>
                <textarea id="noticeContent" rows="3" placeholder="公告内容，多行直接换行">我们致力于维护各个圈子的发展、安全与和谐。
如果您需要技术支持或希望注册新圈子，请通过下方链接联系我们。</textarea>
            </div>
            <div class="inline-flex">
                <div class="field-group">
                    <label>日期</label>
                    <input type="text" id="noticeDate" value="2026-07-24" placeholder="2026-07-24">
                </div>
                <div class="field-group">
                    <label>作者</label>
                    <input type="text" id="noticeAuthor" value="OC99 管理组" placeholder="作者">
                </div>
                <div class="field-group">
                    <label>类型</label>
                    <select id="noticeType">
                        <option value="重要" selected>重要</option>
                        <option value="更新">更新</option>
                        <option value="维护">维护</option>
                        <option value="普通">普通</option>
                    </select>
                </div>
            </div>

            <hr style="border:1px solid #dce7f0; margin: 1.8rem 0 1.2rem;">

            <h2 style="margin-bottom:0.5rem;">🧩 小圈列表</h2>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.8rem;">
                <input type="text" id="circleName" placeholder="圈名" style="flex:1; min-width:100px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                <input type="text" id="circleStatus" placeholder="状态 (active/maintenance/offline)" style="flex:1; min-width:120px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                <input type="text" id="circleUrl" placeholder="链接 (可选)" style="flex:1; min-width:100px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                <button class="btn btn-primary" id="addCircleBtn" style="padding:0.3rem 1.2rem;">➕ 添加</button>
            </div>
            <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
                <input type="text" id="circleDesc" placeholder="描述" style="flex:2; min-width:150px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
                <input type="text" id="circleTags" placeholder="标签 逗号分隔 (如: 技术,开源)" style="flex:1; min-width:120px; padding:0.4rem 0.8rem; border:1px solid #d0dde9; border-radius:40px;">
            </div>

            <div class="circle-list" id="circleListContainer">
                <!-- 动态渲染圈子列表 -->
                <div class="empty-hint">暂无圈子，添加后显示在此</div>
            </div>

            <div class="action-row">
                <button class="btn btn-primary" id="generateBtn">✅ 生成配置</button>
                <button class="btn btn-outline" id="resetDefaultBtn">↩️ 恢复默认</button>
            </div>
            <div style="margin-top:0.6rem; font-size:0.8rem; color:#4f718b;">
                ⚡ 点击“生成配置”后在右侧预览 JSON，可复制粘贴。
            </div>
        </div>

        <!-- 右：json 展示 -->
        <div class="json-preview">
            <h2>
                📄 config.json
                <span style="display:flex; gap:0.8rem; align-items:center;">
                    <span class="copy-toast" id="copyToast">已复制</span>
                    <button id="copyBtn">📋 复制</button>
                </span>
            </h2>
            <div class="json-code" id="jsonOutput">
                // 点击 “生成配置” 预览 JSON
            </div>
        </div>
    </div>

    <div class="footer-note">
        <span>编辑后生成 JSON，手动复制到 config.json 文件。</span>
        <span>OC99.TOP · 配置驱动</span>
    </div>
</div>

<script>
    (function() {
        // ----- 默认数据 -----
        const DEFAULT_NOTICE = {
            title: "欢迎来到 OC99.TOP",
            content: "我们致力于维护各个圈子的发展、安全与和谐。\n如果您需要技术支持或希望注册新圈子，请通过下方链接联系我们。",
            date: "2026-07-24",
            author: "OC99 管理组",
            type: "重要"
        };

        const DEFAULT_CIRCLES = [
            { name: "示例圈 A", description: "这是一个活跃的示例圈子，专注于技术交流与资源共享。", status: "active", url: "https://example-a.oc99.top", tags: ["技术", "开源"] },
            { name: "示例圈 B", description: "该圈子目前正在进行服务器维护，预计明日恢复。", status: "maintenance", url: "https://example-b.oc99.top", tags: ["社区", "维护中"] },
            { name: "示例圈 C", description: "由于业务调整，该圈子暂时离线，重启时间待定。", status: "offline", url: "", tags: ["暂停"] }
        ];

        // ----- 状态 -----
        let circles = JSON.parse(JSON.stringify(DEFAULT_CIRCLES)); // 深拷贝

        // DOM 引用
        const noticeTitle = document.getElementById('noticeTitle');
        const noticeContent = document.getElementById('noticeContent');
        const noticeDate = document.getElementById('noticeDate');
        const noticeAuthor = document.getElementById('noticeAuthor');
        const noticeType = document.getElementById('noticeType');

        const circleName = document.getElementById('circleName');
        const circleStatus = document.getElementById('circleStatus');
        const circleUrl = document.getElementById('circleUrl');
        const circleDesc = document.getElementById('circleDesc');
        const circleTags = document.getElementById('circleTags');

        const circleListContainer = document.getElementById('circleListContainer');
        const jsonOutput = document.getElementById('jsonOutput');
        const generateBtn = document.getElementById('generateBtn');
        const resetDefaultBtn = document.getElementById('resetDefaultBtn');
        const addCircleBtn = document.getElementById('addCircleBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyToast = document.getElementById('copyToast');

        // ----- 渲染圈子列表 (左栏) -----
        function renderCircleList() {
            if (!circles.length) {
                circleListContainer.innerHTML = `<div class="empty-hint">暂无圈子，添加后显示在此</div>`;
                return;
            }
            let html = '';
            circles.forEach((c, index) => {
                const tagsStr = (c.tags && c.tags.length) ? c.tags.map(t => `<span class="tag-badge">${t}</span>`).join(' ') : '';
                html += `
                    <div class="circle-item">
                        <div class="info">
                            ${c.name || '未命名'} 
                            <small>${c.status || '未知'}</small>
                            ${c.url ? `<span style="color:#1f5e85; font-weight:400;">🔗</span>` : ''}
                            <span style="font-weight:400; color:#2d5a7a;">${tagsStr}</span>
                        </div>
                        <div class="actions">
                            <button data-index="${index}" class="remove-circle-btn">✕</button>
                        </div>
                    </div>
                `;
            });
            circleListContainer.innerHTML = html;
            // 绑定删除事件
            document.querySelectorAll('.remove-circle-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < circles.length) {
                        circles.splice(idx, 1);
                        renderCircleList();
                        // 自动生成预览（方便）
                        generateConfig();
                    }
                });
            });
        }

        // ----- 从表单读取公告对象 -----
        function getNoticeFromForm() {
            return {
                title: noticeTitle.value.trim() || '公告',
                content: noticeContent.value || '（空内容）',
                date: noticeDate.value.trim() || new Date().toISOString().slice(0,10),
                author: noticeAuthor.value.trim() || '管理员',
                type: noticeType.value || '普通'
            };
        }

        // ----- 生成 JSON 并展示 -----
        function generateConfig() {
            const notice = getNoticeFromForm();
            // 清理圈子数据：保证每个圈子有基本字段，tags 转为数组
            const cleanCircles = circles.map(c => {
                let tags = [];
                if (c.tags) {
                    if (Array.isArray(c.tags)) tags = c.tags;
                    else if (typeof c.tags === 'string') {
                        tags = c.tags.split(',').map(s => s.trim()).filter(Boolean);
                    }
                }
                return {
                    name: c.name || '未命名',
                    description: c.description || '',
                    status: c.status || 'active',
                    url: c.url || '',
                    tags: tags
                };
            });

            const config = {
                notice: notice,
                circles: cleanCircles
            };

            const pretty = JSON.stringify(config, null, 2);
            jsonOutput.textContent = pretty;
            return pretty;
        }

        // ----- 从 JSON 字符串加载到表单 (用于恢复默认) -----
        function loadConfigToForm(notice, circlesData) {
            // 公告
            if (notice) {
                noticeTitle.value = notice.title || '';
                noticeContent.value = notice.content || '';
                noticeDate.value = notice.date || '';
                noticeAuthor.value = notice.author || '';
                noticeType.value = notice.type || '普通';
            }
            // 圈子
            if (Array.isArray(circlesData)) {
                circles = JSON.parse(JSON.stringify(circlesData));
                renderCircleList();
            }
            generateConfig();
        }

        // ----- 重置为默认 -----
        function resetToDefault() {
            loadConfigToForm(DEFAULT_NOTICE, DEFAULT_CIRCLES);
        }

        // ----- 添加圈子 (从表单) -----
        function addCircleFromForm() {
            const name = circleName.value.trim() || '未命名';
            const status = circleStatus.value.trim() || 'active';
            const url = circleUrl.value.trim() || '';
            const description = circleDesc.value.trim() || '';
            const tagsRaw = circleTags.value.trim();
            let tags = [];
            if (tagsRaw) {
                tags = tagsRaw.split(',').map(s => s.trim()).filter(Boolean);
            }
            // 简单校验 status
            const validStatus = ['active', 'maintenance', 'offline'];
            const finalStatus = validStatus.includes(status) ? status : 'active';

            circles.push({
                name: name,
                description: description,
                status: finalStatus,
                url: url,
                tags: tags
            });

            // 清空输入（保留部分方便连续添加）
            circleName.value = '';
            circleStatus.value = '';
            circleUrl.value = '';
            circleDesc.value = '';
            circleTags.value = '';

            renderCircleList();
            generateConfig();
        }

        // ----- 复制 JSON -----
        function copyJson() {
            const text = jsonOutput.textContent;
            if (!text || text.startsWith('//')) {
                alert('请先生成配置 (点击“生成配置”按钮)');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                copyToast.classList.add('show');
                setTimeout(() => copyToast.classList.remove('show'), 2000);
            }).catch(() => {
                // fallback
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                copyToast.classList.add('show');
                setTimeout(() => copyToast.classList.remove('show'), 2000);
            });
        }

        // ----- 初始化 -----
        function init() {
            // 载入默认
            resetToDefault();

            // 事件绑定
            generateBtn.addEventListener('click', generateConfig);
            resetDefaultBtn.addEventListener('click', resetToDefault);
            addCircleBtn.addEventListener('click', addCircleFromForm);
            copyBtn.addEventListener('click', copyJson);

            // 额外：回车快捷添加（在任意输入框按回车触发添加）
            const inputs = [circleName, circleStatus, circleUrl, circleDesc, circleTags];
            inputs.forEach(inp => {
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addCircleFromForm();
                    }
                });
            });
        }

        init();
    })();
</script>
</body>
</html>
