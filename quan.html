<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC99.TOP · 所有小圈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f9fc;
            color: #1e293b;
            line-height: 1.6;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,20,30,0.15);
            padding: 2.5rem 2.8rem;
            transition: all 0.2s;
        }

        /* 头部 */
        .page-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 1.2rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #0b2b44;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .page-header h1 a {
            color: #1f5e85;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            background: #ecf3f9;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            margin-left: 0.5rem;
            transition: background 0.1s;
        }
        .page-header h1 a:hover {
            background: #d4e3ef;
        }

        .page-header .total-badge {
            background: #d9e6f2;
            color: #1f4b6e;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* 搜索栏 */
        .search-bar {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 0.7rem 1.2rem;
            border: 1px solid #d0dde9;
            border-radius: 60px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fafcff;
            transition: 0.15s;
            outline: none;
        }
        .search-bar input:focus {
            border-color: #2b7aa2;
            box-shadow: 0 0 0 3px rgba(43,122,162,0.12);
        }
        .search-bar input::placeholder {
            color: #94a9bc;
        }
        .search-bar .search-btn {
            background: #1b5e85;
            color: white;
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .search-bar .search-btn:hover {
            background: #124a6b;
        }

        /* 筛选标签 */
        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .filter-tag {
            background: #ecf3f9;
            color: #1f4b6e;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.1s;
        }
        .filter-tag:hover {
            background: #d4e3ef;
        }
        .filter-tag.active {
            background: #1b5e85;
            color: white;
        }

        /* 圈子网格 */
        .circle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            min-height: 200px;
        }

        .circle-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem 1.2rem 1.2rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .circle-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px -8px rgba(18,52,77,0.10);
            border-color: #cbdde9;
        }

        .circle-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #13384f;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .circle-name .status-badge {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0.15rem 0.6rem;
            border-radius: 60px;
            background: #e6edf4;
            color: #2d5a7a;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .status-badge.active { background: #d4edda; color: #0c5e3a; }
        .status-badge.maintenance { background: #fff3cd; color: #8a6d1f; }
        .status-badge.offline { background: #f8d7da; color: #a12434; }

        .circle-desc {
            font-size: 0.85rem;
            color: #475569;
            margin: 0.5rem 0 0.6rem 0;
            line-height: 1.4;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .circle-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #64748b;
            border-top: 1px solid #ecf1f7;
            padding-top: 0.7rem;
            margin-top: 0.2rem;
        }
        .circle-meta .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .circle-meta .tag {
            background: #eef4fa;
            padding: 0.1rem 0.5rem;
            border-radius: 60px;
            font-size: 0.65rem;
            color: #2d5a7a;
        }
        .circle-meta .visit-link {
            color: #1f5e85;
            text-decoration: none;
            font-weight: 500;
            background: #ecf3f9;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            transition: background 0.1s;
        }
        .circle-meta .visit-link:hover {
            background: #d4e3ef;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
            background: #f8fafc;
            border-radius: 40px;
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .pagination button {
            background: #ecf3f9;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f4b6e;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .pagination button:hover:not(:disabled) {
            background: #d4e3ef;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination button.active {
            background: #1b5e85;
            color: white;
        }
        .pagination .page-info {
            color: #64748b;
            font-size: 0.85rem;
            padding: 0 0.5rem;
        }

        /* 详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 32px;
            max-width: 560px;
            width: 100%;
            padding: 2.2rem 2.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            position: relative;
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #64748b;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 40px;
            transition: 0.1s;
            line-height: 1;
        }
        .modal-close:hover {
            background: #f1f5f9;
        }

        .modal-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b2b44;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .modal-status {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
        }

        .modal-desc {
            font-size: 1rem;
            color: #334155;
            margin: 1rem 0 1.2rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .modal-detail-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }
        .modal-detail-row .label {
            color: #64748b;
            min-width: 80px;
            font-weight: 500;
        }
        .modal-detail-row .value {
            color: #1e293b;
        }
        .modal-detail-row .value a {
            color: #1f5e85;
            text-decoration: none;
            font-weight: 500;
        }
        .modal-detail-row .value a:hover {
            text-decoration: underline;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .modal-tags .tag {
            background: #eef4fa;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #2d5a7a;
        }

        .modal-footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #ecf1f7;
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }
        .modal-footer .btn {
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: 0.1s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .modal-footer .btn-primary {
            background: #1b5e85;
            color: white;
        }
        .modal-footer .btn-primary:hover {
            background: #124a6b;
        }
        .modal-footer .btn-secondary {
            background: #ecf3f9;
            color: #1f4b6e;
        }
        .modal-footer .btn-secondary:hover {
            background: #d4e3ef;
        }

        /* 底部 */
        .footer-note {
            margin-top: 2.5rem;
            border-top: 1px solid #e2eaf0;
            padding-top: 1.5rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        @media (max-width: 700px) {
            .container { padding: 1.5rem 1.2rem; }
            .page-header h1 { font-size: 1.4rem; }
            .circle-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .modal-content { padding: 1.5rem; }
        }
        @media (max-width: 480px) {
            .circle-grid { grid-template-columns: 1fr; }
            .search-bar input { min-width: 140px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 头部 -->
        <div class="page-header">
            <h1>
                🌐 全部小圈
                <a href="/">← 返回首页</a>
            </h1>
            <span class="total-badge" id="totalCount">0 个</span>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索圈子名称、描述或标签…" autocomplete="off">
            <button class="search-btn" id="searchBtn">🔍 搜索</button>
        </div>

        <!-- 状态筛选 -->
        <div class="filter-tags" id="filterTags">
            <button class="filter-tag active" data-filter="all">全部</button>
            <button class="filter-tag" data-filter="active">🟢 活跃</button>
            <button class="filter-tag" data-filter="maintenance">🟡 维护</button>
            <button class="filter-tag" data-filter="offline">🔴 离线</button>
        </div>

        <!-- 圈子网格 -->
        <div id="circleGrid" class="circle-grid">
            <div class="empty-state">⏳ 加载中...</div>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination"></div>

        <div class="footer-note">
            OC99.TOP · 维护圈子生态 · 每页展示 15 个圈子
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div class="modal-name" id="modalName"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <div class="modal-detail-row">
                <span class="label">状态</span>
                <span class="value" id="modalStatus"></span>
            </div>
            <div class="modal-detail-row">
                <span class="label">链接</span>
                <span class="value" id="modalUrl"></span>
            </div>
            <div class="modal-detail-row">
                <span class="label">标签</span>
                <span class="value modal-tags" id="modalTags"></span>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCloseBtn2">关闭</button>
                <a class="btn btn-primary" id="modalVisitBtn" target="_blank">🚀 访问圈子</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const CIRCLES_PATH = 'circles.json';
            const PAGE_SIZE = 15;

            // 状态
            let allCircles = [];
            let filteredCircles = [];
            let currentPage = 1;
            let currentFilter = 'all';
            let currentSearch = '';

            // DOM
            const grid = document.getElementById('circleGrid');
            const pagination = document.getElementById('pagination');
            const totalCount = document.getElementById('totalCount');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const filterBtns = document.querySelectorAll('.filter-tag');
            const modal = document.getElementById('detailModal');
            const modalName = document.getElementById('modalName');
            const modalDesc = document.getElementById('modalDesc');
            const modalStatus = document.getElementById('modalStatus');
            const modalUrl = document.getElementById('modalUrl');
            const modalTags = document.getElementById('modalTags');
            const modalVisitBtn = document.getElementById('modalVisitBtn');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCloseBtn2 = document.getElementById('modalCloseBtn2');

            // ---------- 辅助 ----------
            function getStatusText(status) {
                const map = { 'active': '🟢 活跃', 'maintenance': '🟡 维护', 'offline': '🔴 离线' };
                return map[status] || status || '未知';
            }

            function getStatusClass(status) {
                const map = { 'active': 'active', 'maintenance': 'maintenance', 'offline': 'offline' };
                return map[status] || '';
            }

            // 搜索匹配
            function matchCircle(c, query) {
                if (!query) return true;
                const q = query.toLowerCase();
                return (c.name && c.name.toLowerCase().includes(q)) ||
                       (c.description && c.description.toLowerCase().includes(q)) ||
                       (c.tags && c.tags.some(t => t.toLowerCase().includes(q)));
            }

            // 过滤 + 搜索
            function filterAndSearch() {
                let list = allCircles;

                // 状态过滤
                if (currentFilter !== 'all') {
                    list = list.filter(c => c.status === currentFilter);
                }

                // 搜索
                if (currentSearch) {
                    list = list.filter(c => matchCircle(c, currentSearch));
                }

                filteredCircles = list;
                currentPage = 1;
                render();
            }

            // 分页数据
            function getPageData() {
                const start = (currentPage - 1) * PAGE_SIZE;
                const end = Math.min(start + PAGE_SIZE, filteredCircles.length);
                return filteredCircles.slice(start, end);
            }

            function getTotalPages() {
                return Math.max(1, Math.ceil(filteredCircles.length / PAGE_SIZE));
            }

            // ---------- 渲染 ----------
            function render() {
                renderGrid();
                renderPagination();
                totalCount.textContent = `${filteredCircles.length} 个`;
            }

            function renderGrid() {
                const pageData = getPageData();

                if (filteredCircles.length === 0) {
                    grid.innerHTML = `<div class="empty-state">🔍 没有找到匹配的圈子</div>`;
                    return;
                }

                let html = '';
                pageData.forEach(c => {
                    const sc = getStatusClass(c.status);
                    const st = getStatusText(c.status);
                    const desc = c.description || '—';
                    const tagsHtml = c.tags && c.tags.length
                        ? c.tags.map(t => `<span class="tag">${t}</span>`).join('')
                        : '';

                    html += `
                        <div class="circle-card" data-name="${c.name || ''}" data-desc="${(c.description || '')}" data-status="${c.status || ''}" data-url="${c.url || ''}" data-tags='${JSON.stringify(c.tags || [])}'>
                            <div class="circle-name">
                                ${c.name || '未命名圈子'}
                                <span class="status-badge ${sc}">${st}</span>
                            </div>
                            <div class="circle-desc">${desc}</div>
                            <div class="circle-meta">
                                <span class="tags">${tagsHtml}</span>
                                ${c.url ? `<span class="visit-link" onclick="event.stopPropagation(); window.open('${c.url}','_blank')">访问 →</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                // 绑定点击事件 — 打开详情弹窗
                grid.querySelectorAll('.circle-card').forEach(card => {
                    card.addEventListener('click', function() {
                        openDetail({
                            name: this.dataset.name,
                            desc: this.dataset.desc,
                            status: this.dataset.status,
                            url: this.dataset.url,
                            tags: JSON.parse(this.dataset.tags || '[]')
                        });
                    });
                });
            }

            function renderPagination() {
                const totalPages = getTotalPages();
                if (filteredCircles.length === 0) {
                    pagination.innerHTML = '';
                    return;
                }

                let html = '';
                // 上一页
                html += `<button class="page-prev" ${currentPage <= 1 ? 'disabled' : ''} data-page="${currentPage - 1}">← 上一页</button>`;

                // 页码
                const maxVisible = 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage + 1 < maxVisible) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                if (startPage > 1) {
                    html += `<button data-page="1">1</button>`;
                    if (startPage > 2) html += `<span class="page-info">…</span>`;
                }
                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
                }
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += `<span class="page-info">…</span>`;
                    html += `<button data-page="${totalPages}">${totalPages}</button>`;
                }

                // 下一页
                html += `<button class="page-next" ${currentPage >= totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">下一页 →</button>`;

                // 信息
                const start = (currentPage - 1) * PAGE_SIZE + 1;
                const end = Math.min(currentPage * PAGE_SIZE, filteredCircles.length);
                html += `<span class="page-info">${start}-${end} / ${filteredCircles.length}</span>`;

                pagination.innerHTML = html;

                // 绑定分页事件
                pagination.querySelectorAll('button[data-page]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (this.disabled) return;
                        const page = parseInt(this.dataset.page, 10);
                        if (page >= 1 && page <= totalPages) {
                            currentPage = page;
                            render();
                            // 滚动到顶部
                            grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                });
            }

            // ---------- 详情弹窗 ----------
            function openDetail(circle) {
                const st = getStatusText(circle.status);
                const sc = getStatusClass(circle.status);

                modalName.innerHTML = `${circle.name || '未命名圈子'} <span class="modal-status status-badge ${sc}">${st}</span>`;
                modalDesc.textContent = circle.desc || '暂无描述';

                // 状态
                modalStatus.textContent = st;

                // 链接
                if (circle.url) {
                    modalUrl.innerHTML = `<a href="${circle.url}" target="_blank">${circle.url}</a>`;
                } else {
                    modalUrl.textContent = '暂无链接';
                }

                // 标签
                if (circle.tags && circle.tags.length) {
                    modalTags.innerHTML = circle.tags.map(t => `<span class="tag">${t}</span>`).join('');
                } else {
                    modalTags.innerHTML = '<span style="color:#94a3b8;">无标签</span>';
                }

                // 访问按钮
                if (circle.url) {
                    modalVisitBtn.href = circle.url;
                    modalVisitBtn.style.display = 'inline-flex';
                } else {
                    modalVisitBtn.style.display = 'none';
                }

                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function closeDetail() {
                modal.classList.remove('show');
                document.body.style.overflow = '';
            }

            // 点击遮罩关闭
            modal.addEventListener('click', function(e) {
                if (e.target === this) closeDetail();
            });

            modalCloseBtn.addEventListener('click', closeDetail);
            modalCloseBtn2.addEventListener('click', closeDetail);

            // ESC 键关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) closeDetail();
            });

            // ---------- 加载数据 ----------
            async function loadCircles() {
                try {
                    const resp = await fetch(CIRCLES_PATH, { cache: 'no-cache', headers: { 'Accept': 'application/json' } });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();
                    if (!Array.isArray(data)) throw new Error('格式错误');
                    allCircles = data;
                } catch (error) {
                    console.error('加载 circles.json 失败:', error);
                    allCircles = [];
                }
                filterAndSearch();
            }

            // ---------- 事件绑定 ----------
            // 搜索
            function doSearch() {
                currentSearch = searchInput.value.trim();
                filterAndSearch();
            }

            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doSearch();
            });

            // 状态筛选
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    filterAndSearch();
                });
            });

            // 启动
            loadCircles();
        })();
    </script>
</body>
</html>
