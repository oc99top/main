<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC99.TOP · 圈子共建</title>
    <!-- 使用清爽的字体 & 简单重置 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f9fc;
            color: #1e293b;
            line-height: 1.6;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,20,30,0.15);
            padding: 2.5rem 2.8rem;
            transition: all 0.2s;
        }

        /* header */
        .brand {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #0b2b44, #1a4b6d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .brand h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #64748b;
            background: none;
            -webkit-text-fill-color: #64748b;
            margin-left: 0.5rem;
        }

        .tagline {
            color: #475569;
            background: #f1f5f9;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* 公告卡片 */
        .notice-board {
            background: #f8fafc;
            border-left: 6px solid #2b6f9e;
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin-bottom: 2.8rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }

        .notice-board h2 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 1.2rem;
            color: #0f3b55;
            margin-bottom: 0.5rem;
        }

        .notice-board h2 span {
            background: #2b6f9e;
            color: white;
            font-size: 0.7rem;
            border-radius: 60px;
            padding: 0.2rem 0.8rem;
            letter-spacing: 0.4px;
        }

        .notice-content {
            font-size: 1.05rem;
            color: #1e293b;
            padding: 0.4rem 0 0.2rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .notice-meta {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px dashed #dce2ea;
            padding-top: 0.7rem;
            display: flex;
            justify-content: flex-end;
        }

        /* 圈子网格 */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2.2rem 0 1.2rem 0;
        }
        .section-title h3 {
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.01em;
            color: #0b2b44;
        }
        .section-title .badge {
            background: #d9e6f2;
            color: #1f4b6e;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .circle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        .circle-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 1.5rem 1.2rem 1.2rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
        }
        .circle-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px -8px rgba(18, 52, 77, 0.10);
            border-color: #cbdde9;
        }

        .circle-name {
            font-weight: 700;
            font-size: 1.3rem;
            color: #13384f;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .circle-name .status-badge {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 60px;
            background: #e6edf4;
            color: #2d5a7a;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .status-badge.active {
            background: #d4edda;
            color: #0c5e3a;
        }
        .status-badge.maintenance {
            background: #fff3cd;
            color: #8a6d1f;
        }
        .status-badge.offline {
            background: #f8d7da;
            color: #a12434;
        }

        .circle-desc {
            font-size: 0.9rem;
            color: #475569;
            margin: 0.6rem 0 0.8rem 0;
            line-height: 1.4;
            flex: 1;
        }

        .circle-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #ecf1f7;
            padding-top: 0.8rem;
            margin-top: 0.3rem;
        }
        .circle-meta a {
            color: #1f5e85;
            text-decoration: none;
            font-weight: 500;
            background: #ecf3f9;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            transition: background 0.1s;
        }
        .circle-meta a:hover {
            background: #d4e3ef;
        }

        .substack {
            margin-top: 2.8rem;
            border-top: 1px solid #e2eaf0;
            padding-top: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            color: #3c5a70;
            font-size: 0.9rem;
        }
        .substack .links a {
            color: #1f5e85;
            text-decoration: none;
            margin-left: 1.2rem;
            font-weight: 500;
        }
        .substack .links a:hover {
            text-decoration: underline;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #64748b;
            background: #f8fafc;
            border-radius: 40px;
            font-size: 0.95rem;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .container { padding: 1.8rem 1.2rem; }
            .brand h1 { font-size: 1.8rem; }
            .brand { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .notice-board { padding: 1.2rem; }
            .circle-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .circle-grid { grid-template-columns: 1fr; }
            .substack { flex-direction: column; gap: 0.8rem; align-items: flex-start; }
            .substack .links a { margin-left: 0; margin-right: 1.2rem; }
        }

        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 头部 -->
        <header class="brand">
            <h1>OC99<span style="font-weight:400; background:none; -webkit-text-fill-color:#1e4b6b;">.TOP</span> <small>· 圈子共建</small></h1>
            <div class="tagline">⚡ 安全 · 和谐 · 技术支持</div>
        </header>

        <!-- 公告区域 (动态) -->
        <div class="notice-board" id="noticeBoard">
            <h2>
                📢 站内公告
                <span id="noticeTag">最新</span>
            </h2>
            <div class="notice-content" id="noticeContent">
                加载公告中...
            </div>
            <div class="notice-meta" id="noticeMeta"></div>
        </div>

        <!-- 圈子列表 -->
        <div class="section-title">
            <h3>🌐 已注册小圈</h3>
            <span class="badge" id="circleCount">0 个</span>
        </div>

        <div id="circleGrid" class="circle-grid">
            <!-- 动态渲染卡片 -->
        </div>

        <!-- 子站 & 其他 -->
        <div class="substack">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <span>📄 <a href="https://doc.oc99.top" target="_blank">doc.oc99.top</a> · 协议/公告/群规</span>
                <span>🛡️ <a href="https://safe.oc99.top" target="_blank">safe.oc99.top</a> · 安全查询/举报 <span style="color:#8b9eb0; font-size:0.75rem;">(建设中)</span></span>
            </div>
            <div class="links">
                <a href="#">关于</a>
                <a href="#">加入</a>
            </div>
        </div>
        <div class="footer-note">
            OC99.TOP · 维护圈子生态 · 配置驱动
        </div>
    </div>

    <script>
        (function() {
            // ---------- 全局状态 ----------
            const CONFIG_PATH = 'config.json';   // 独立配置文件

            // DOM 引用
            const noticeContent = document.getElementById('noticeContent');
            const noticeMeta = document.getElementById('noticeMeta');
            const noticeTag = document.getElementById('noticeTag');
            const circleGrid = document.getElementById('circleGrid');
            const circleCount = document.getElementById('circleCount');

            // ---------- 辅助函数 ----------
            function getStatusText(status) {
                const map = {
                    'active': '🟢 活跃',
                    'maintenance': '🟡 维护',
                    'offline': '🔴 离线',
                    // fallback
                };
                return map[status] || status || '未知';
            }

            function getStatusClass(status) {
                const map = {
                    'active': 'active',
                    'maintenance': 'maintenance',
                    'offline': 'offline',
                };
                return map[status] || '';
            }

            // 渲染圈子卡片
            function renderCircles(circles) {
                if (!circles || circles.length === 0) {
                    circleGrid.innerHTML = `<div class="empty-state">✨ 暂无已注册小圈，等待你的加入</div>`;
                    circleCount.textContent = '0 个';
                    return;
                }

                let html = '';
                circles.forEach(c => {
                    const statusClass = getStatusClass(c.status);
                    const statusDisplay = getStatusText(c.status);
                    // 安全处理描述
                    const desc = c.description || '—';
                    // 如果有 url 则显示链接，否则占位
                    const linkHtml = c.url 
                        ? `<a href="${c.url}" target="_blank">访问 →</a>` 
                        : `<span style="color:#9aaec0;">暂无链接</span>`;

                    html += `
                        <div class="circle-card">
                            <div class="circle-name">
                                ${c.name || '未命名圈子'}
                                <span class="status-badge ${statusClass}">${statusDisplay}</span>
                            </div>
                            <div class="circle-desc">${desc}</div>
                            <div class="circle-meta">
                                <span>${c.tags ? c.tags.join(' · ') : ''}</span>
                                ${linkHtml}
                            </div>
                        </div>
                    `;
                });
                circleGrid.innerHTML = html;
                circleCount.textContent = `${circles.length} 个`;
            }

            // 渲染公告
            function renderNotice(notice) {
                if (!notice) {
                    noticeContent.textContent = '暂无公告，请保持关注。';
                    noticeMeta.textContent = '';
                    noticeTag.textContent = '📌';
                    return;
                }
                // 标题 (如果有)
                const title = notice.title ? `【${notice.title}】` : '';
                const content = notice.content || '（空公告）';
                // 支持换行
                noticeContent.innerHTML = `${title ? `<strong>${title}</strong><br>` : ''}${content.replace(/\n/g, '<br>')}`;
                
                // 更新时间/标签
                let metaParts = [];
                if (notice.date) metaParts.push(`📅 ${notice.date}`);
                if (notice.author) metaParts.push(`✏️ ${notice.author}`);
                noticeMeta.textContent = metaParts.join(' · ');
                
                // 标签小标记 (可根据类型)
                if (notice.type) {
                    const typeMap = {
                        '重要': '🔔',
                        '更新': '🔄',
                        '维护': '🛠️',
                    };
                    noticeTag.textContent = typeMap[notice.type] || '📢';
                } else {
                    noticeTag.textContent = '📢';
                }
            }

            // ---------- 加载 config.json ----------
            async function loadConfig() {
                try {
                    const response = await fetch(CONFIG_PATH, {
                        cache: 'no-cache', // 防止浏览器强缓存，便于编辑后刷新
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法加载 config.json`);
                    }
                    const config = await response.json();

                    // 校验基本结构
                    if (!config) throw new Error('配置为空');

                    // 1. 公告
                    const notice = config.notice || null;
                    renderNotice(notice);

                    // 2. 圈子列表
                    const circles = config.circles || [];
                    if (!Array.isArray(circles)) {
                        console.warn('circles 字段不是数组，使用空列表');
                        renderCircles([]);
                    } else {
                        renderCircles(circles);
                    }

                    // 可选：额外展示版本或更新时间，略

                } catch (error) {
                    console.error('加载 config.json 失败:', error);
                    // 显示错误状态，但保持界面友好
                    noticeContent.textContent = '⚠️ 无法加载公告配置，请检查 config.json 文件。';
                    noticeMeta.textContent = '请确保文件存在且格式正确';
                    circleGrid.innerHTML = `<div class="empty-state">⚠️ 加载圈子数据失败，请检查网络或配置文件</div>`;
                    circleCount.textContent = '加载失败';
                }
            }

            // 启动加载
            loadConfig();

            // 可选： 如果用户想手动刷新（但简单起见，加载一次）
            // 若未来需要定期刷新，可加上 setInterval，但最好由用户手动刷新页面
            // 暴露 reload 到控制台方便调试
            window.reloadOC = loadConfig;
        })();
    </script>
</body>
</html>
